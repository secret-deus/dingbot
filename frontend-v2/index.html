<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>钉钉K8s运维机器人</title>
  <meta name="description" content="基于AI的智能Kubernetes运维助手">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/src/assets/images/favicon.svg">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  
  <!-- Element Plus styles will be imported in main.js -->
  
    <style>
      /* Clean Loading Screen */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }

      .loading-content {
        text-align: center;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-radius: 50%;
        border-top: 3px solid #0969da;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading-text {
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
      }

      /* Hide loading screen when app is ready */
      .app-ready #loading {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease-out;
      }
    </style>
</head>
<body>
  <!-- KaTeX 动态加载，详见 utils/katex.js -->
  
  <!-- Loading screen -->
  <div id="loading">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">钉钉K8s运维机器人启动中...</div>
    </div>
  </div>
  
  <!-- Vue app mount point -->
  <div id="app"></div>
  
  <!-- Main script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
