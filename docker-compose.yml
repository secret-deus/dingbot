# Compatibility project name retained for existing Docker resource prefixes.
name: ding-robot

services:
  backend:
    build:
      context: .
      dockerfile: backend-v2/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend-v2/data:/app/data
      - ./backend-v2/logs:/app/logs
      - ./config:/app/config
    env_file:
      - ./backend-v2/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend-v3
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
