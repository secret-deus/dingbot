[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ecs-mcp"
version = "0.1.0"
description = "ECS MCP服务器 - 基于阿里云ECS监控构建的只读巡检工具集"
readme = "README.md"
license = "MIT"
authors = ["ECS MCP Team <admin@example.com>"]
keywords = ["ecs", "mcp", "aliyun", "devops", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
]
packages = [{include = "ecs_mcp", from = "src"}]
include = ["src/ecs_mcp/config/*.yaml", "src/ecs_mcp/config/*.json"]

[tool.poetry.urls]
Homepage = "https://github.com/example/ecs-mcp"
Repository = "https://github.com/example/ecs-mcp"
Issues = "https://github.com/example/ecs-mcp/issues"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
httpx = "^0.27.0"
loguru = "^0.7.0"
pyyaml = "^6.0"
python-dotenv = "^1.0.0"
orjson = "^3.9.0"

# 阿里云ECS SDK
alibabacloud_ecs20140526 = "^3.0.0"
alibabacloud_tea_openapi = "^0.3.13"
alibabacloud_tea_util = "^0.3.13"
alibabacloud_credentials = "^0.3.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.5.0"

[tool.poetry.scripts]
ecs-mcp-server = "ecs_mcp.server:main"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["ecs_mcp"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
markers = [
    "asyncio: mark test as asyncio test",
]
testpaths = ["tests"]
asyncio_mode = "auto"


