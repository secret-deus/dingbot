[tool.poetry]
name = "dingtalk-k8s-robot"
version = "2.0.0"
description = "钉钉K8s运维机器人 - LLM对话+MCP工具集成"
authors = ["DingTalk Bot Team <team@example.com>"]
readme = "README.md"
packages = [{include = "backend"}]

[tool.poetry.dependencies]
# 3.14：pydantic-core 需从源码编译时，PyO3 暂不支持 3.14（仅到 3.13）；crewai 亦要求 <3.14
python = ">=3.11,<3.14"
# 核心框架
fastapi = ">=0.104.1"
uvicorn = ">=0.24.0"
pydantic = ">=2.8.0"
# HTTP 客户端
httpx = ">=0.27.0"
requests = ">=2.31.0"
aiohttp = ">=3.9.0"
# WebSocket 客户端
websockets = ">=12.0"
# MCP 和 AI 相关
openai = ">=1.40.0"
# Kubernetes 客户端
kubernetes = ">=28.1.0"
# 进程内 K8s 知识图谱等（原 k8s-mcp）
networkx = "^3.2.1"
aiofiles = "^23.2.1"
orjson = "^3.9.0"
# 进程内 ECS（原 ecs-mcp / 阿里云 SDK）
alibabacloud_ecs20140526 = "^3.0.0"
alibabacloud_tea_openapi = "^0.3.13"
alibabacloud_tea_util = "^0.3.13"
alibabacloud_credentials = "^0.3.6"
# 加密和安全
cryptography = ">=41.0.7"
# 工具库
python-dotenv = ">=1.0.0"
loguru = ">=0.7.2"
# 重试和异常处理
tenacity = ">=8.2.0"
python-multipart = "^0.0.20"
python-socks = "^2.7.1"
psutil = "^7.0.0"
pycryptodome = "^3.23.0"
# 文件监控
watchdog = "^4.0.0"
# Cron表达式处理
croniter = "^2.0.0"
# 多智能体编排（可选，USE_CREWAI=true）。上游 crewai 目前要求 Python <3.14，故仅在 <3.14 环境安装。
crewai = { version = ">=0.86.0", markers = "python_version < '3.14'" }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"

[tool.poetry.scripts]
# 开发环境脚本
dev-backend = "scripts.dev:run_backend"
dev-frontend = "scripts.dev:run_frontend"
dev = "scripts.dev:main"

# 构建脚本
build = "scripts.build:build_frontend"

# 生产环境脚本
serve = "scripts.serve:main"
start = "scripts.serve:run_production"
start-all = "scripts.start_all:main"

# 工具脚本
setup = "scripts.setup:main"

# 清理脚本
clean = "scripts.build:clean"

[tool.poetry.urls]
"Homepage" = "https://github.com/your-org/dingtalk-k8s-robot"
"Repository" = "https://github.com/your-org/dingtalk-k8s-robot"
"Documentation" = "https://github.com/your-org/dingtalk-k8s-robot/blob/main/README.md"

# 若访问 files.pythonhosted.org 频繁超时，可改用国内镜像（自行评估合规性）：
# [[tool.poetry.source]]
# name = "tuna"
# url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true